  # ===== en.tiny-story.swordreforge.top =====
  # Append under the `hosts:` section of /usr/local/etc/h2o.conf.
  # TLS certificates are issued by h2o's built-in ACME helper (lego, HTTP-01);
  # restart h2o once after adding a new host so the domain enters the renewal
  # list, then plain `systemctl reload h2o` is enough for later edits.
  "en.tiny-story.swordreforge.top:80":
    listen:
      port: 80
      host: 0.0.0.0
    paths:
      "/.well-known/acme-challenge/": *acme
      "/":
        redirect:
          status: 301
          url: https://en.tiny-story.swordreforge.top/

  "en.tiny-story.swordreforge.top:443":
    listen:
      port: 443
      host: 0.0.0.0
      ssl: *ssl_nocipher
    listen:
      port: 443
      host: 0.0.0.0
      type: quic
      ssl: *ssl_nocipher
      quic: *quic_noamp
    header.set: *sec_hdrs
    # Keep SSE unbuffered: do not enable compression or proxy response buffering.
    compress: OFF
    paths:
      "/.well-known/acme-challenge/": *acme
      "/":
        proxy.reverse.url: http://127.0.0.1:8847
        proxy.http2.ratio: 0
        proxy.preserve-host: ON
        proxy.timeout.io: 300
        proxy.timeout.connect: 60
        proxy.timeout.first_byte: 60
        proxy.timeout.keepalive: 60
